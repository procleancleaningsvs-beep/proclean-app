<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "fonts.dtd">
<!--
  Sustituciones métricamente compatibles para plantillas DOCX de Office.
  Carlito/Caladea/Liberation evitan saltos de línea y espaciado distinto en PDF.
-->
<fontconfig>
  <alias binding="same">
    <family>Calibri</family>
    <prefer><family>Carlito</family></prefer>
  </alias>
  <alias binding="same">
    <family>Cambria</family>
    <prefer><family>Caladea</family></prefer>
  </alias>
  <alias binding="same">
    <family>Arial</family>
    <prefer><family>Liberation Sans</family></prefer>
  </alias>
  <alias binding="same">
    <family>Arial MT</family>
    <prefer><family>Liberation Sans</family></prefer>
  </alias>
  <alias binding="same">
    <family>Times New Roman</family>
    <prefer><family>Liberation Serif</family></prefer>
  </alias>
  <alias binding="same">
    <family>Aptos</family>
    <prefer><family>Carlito</family></prefer>
  </alias>
</fontconfig>
