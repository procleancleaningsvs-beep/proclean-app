{% extends 'base.html' %}
{% block content %}
<section class="auth-card">
  <div class="hero-copy hero-copy-brand">
    <div class="brand-lockup brand-lockup-login" aria-label="ProClean Cleaning Services">
      <img class="brand-lockup-icon" src="{{ url_for('static', filename='branding/proclean-isotype.png') }}" alt="" width="56" height="56" loading="lazy">
      <div class="brand-lockup-text">
        <span class="brand-lockup-name">PROCLEAN</span>
        <span class="brand-lockup-sub">Cleaning Services</span>
      </div>
    </div>
    <span class="eyebrow">Acceso seguro</span>
    <h2>Bienvenido a {{ app_name }}</h2>
    <p>Ingresa con tu cuenta para continuar.</p>
  </div>
  <form method="post" class="form-card compact-form">
    <label>Usuario
      <input type="text" name="username" placeholder="Tu usuario" required>
    </label>
    <label>Contraseña
      <input type="password" name="password" placeholder="Tu contraseña" required>
    </label>
    <button type="submit" class="btn btn-primary">Entrar</button>
  </form>
</section>
{% endblock %}
