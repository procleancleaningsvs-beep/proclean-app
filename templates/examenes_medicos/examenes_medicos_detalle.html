{% extends 'base.html' %}
{% block extra_head %}
<link rel="stylesheet" href="{{ url_for('vitroflex.static', filename='vitroflex.css') }}">
<link rel="stylesheet" href="{{ url_for('examenes_medicos.static', filename='examenes_medicos.css') }}">
{% endblock %}
{% block content %}
<section class="page-head pc-hub-hero pc-history-hero">
  <div class="pc-hub-hero__main">
    <span class="pc-page-eyebrow">Vitroflex</span>
    <h2 class="pc-page-title">Expediente del paciente</h2>
    <p class="em-detalle-meta pc-page-subtitle">Vista completa de respaldo.</p>
  </div>
  <div class="page-head-actions pc-hub-hero__actions">
    <a href="{{ url_for('examenes_medicos.historial_page') }}" class="btn btn-secondary">Historial</a>
  </div>
</section>

<section class="panel vf-panel em-detalle-panel">
  {% include 'examenes_medicos/_expediente_modal_content.html' %}
</section>

{% if is_admin %}
<script>
document.addEventListener("click", function (event) {
  var btn = event.target.closest("[data-em-delete-btn]");
  if (!btn) return;
  event.preventDefault();
  if (btn.dataset.loading === "1") return;
  var patient = btn.getAttribute("data-patient") || "Paciente sin nombre";
  var order = btn.getAttribute("data-order") || "—";
  var ok = confirm(
    "¿Eliminar este expediente del paciente?\n\n" +
    "Paciente: " + patient + "\n" +
    "Orden: " + order + "\n\n" +
    "Se eliminarán solo sus archivos generados y el registro de historial."
  );
  if (!ok) return;
  btn.dataset.loading = "1";
  btn.disabled = true;
  fetch(btn.getAttribute("data-url"), { method: "DELETE", credentials: "same-origin" })
    .then(function (r) {
      return r.json().catch(function () { return {}; }).then(function (j) {
        if (!r.ok || !j.ok) throw new Error(j.error || "No se pudo eliminar el expediente.");
        return j;
      });
    })
    .then(function () { window.location.href = {{ url_for('examenes_medicos.historial_page') | tojson }}; })
    .catch(function (err) {
      alert(err && err.message ? err.message : "No se pudo eliminar el expediente.");
      btn.dataset.loading = "";
      btn.disabled = false;
    });
});
</script>
{% endif %}
{% endblock %}
