{% extends "facturacion_shell.html" %}
{% set fx_nav_active = 'import' %}
{% block fx_main %}
<div class="fx-hero">
  <h1>Importar Excel</h1>
  <p class="fx-muted">Usa el Excel de facturación como referencia inicial. No reemplaza registros existentes (omite duplicados).</p>
</div>
<form method="post" enctype="multipart/form-data" class="fx-form-grid" style="max-width:480px;background:#fff;padding:1.25rem;border-radius:16px;box-shadow:var(--shadow)">
  <label>Año contable<input type="number" name="anio" value="2026" min="2020" max="2040"></label>
  <label>Archivo .xlsx<input type="file" name="archivo" accept=".xlsx,application/vnd.openxmlformats-officedocument.spreadsheetml.sheet" required></label>
  <button type="submit" class="fx-btn fx-btn--primary">Importar</button>
</form>
{% endblock %}
