<style>
.hc-panel { background:var(--panel); border:1px solid var(--line); border-radius:12px; padding:1rem; margin-bottom:1rem; }
.hc-cards { display:grid; grid-template-columns:repeat(auto-fill,minmax(140px,1fr)); gap:.6rem; margin:.75rem 0; }
.hc-card { background:var(--panel-soft); border:1px solid var(--line); border-radius:10px; padding:.65rem; }
.hc-card span { display:block; font-size:.75rem; color:var(--muted); }
.hc-card strong { font-size:1rem; }
.hc-filters { display:grid; grid-template-columns:repeat(auto-fill,minmax(160px,1fr)); gap:.5rem; align-items:end; margin-bottom:.75rem; }
.hc-filters label { display:block; font-size:.82rem; font-weight:600; margin-bottom:.2rem; }
.hc-filters input, .hc-filters select { width:100%; }
.hc-table-wrap { overflow:auto; max-height:62vh; }
.hc-table { width:100%; border-collapse:collapse; font-size:.84rem; }
.hc-table th, .hc-table td { border-bottom:1px solid var(--line); padding:.4rem .45rem; text-align:left; vertical-align:top; }
.hc-table th { position:sticky; top:0; background:var(--panel-soft); z-index:1; }
.hc-badge { display:inline-block; padding:.1rem .35rem; border-radius:6px; font-size:.72rem; background:#e0f2fe; color:#0369a1; margin:.1rem .15rem 0 0; }
.hc-badge.warn { background:#fef3c7; color:#92400e; }
.hc-badge.err { background:#fee2e2; color:#991b1b; }
.hc-badge.ok { background:#dcfce7; color:#166534; }
.hc-actions { display:flex; flex-wrap:wrap; gap:.5rem; margin:.75rem 0; }
.hc-detail-row { display:none; background:var(--panel-soft); }
.hc-detail-row.open { display:table-row; }
.hc-detail-inner { padding:.5rem; font-size:.8rem; }
.hc-alert { padding:.75rem 1rem; border-radius:10px; margin-bottom:1rem; }
.hc-alert.error { background:#fef2f2; border:1px solid #fecaca; color:#991b1b; }
.hc-alert.info { background:#eff6ff; border:1px solid #bfdbfe; color:#1e40af; }
.hc-link-grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(220px,1fr)); gap:.75rem; }
.hc-link-card { display:block; padding:1rem; border:1px solid var(--line); border-radius:10px; text-decoration:none; color:inherit; background:var(--panel-soft); }
.hc-link-card:hover { border-color:var(--brand-blue); }
</style>
